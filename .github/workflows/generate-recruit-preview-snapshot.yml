name: Generate Recruit preview snapshot

on:
  push:
    branches:
      - preview/vercel-pr16-uziuzborn
    paths:
      - scripts/generate-recruit-preview-snapshot.mjs
      - .github/workflows/generate-recruit-preview-snapshot.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview/vercel-pr16-uziuzborn
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate deterministic preview snapshot
        run: node scripts/generate-recruit-preview-snapshot.mjs

      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/recruit-content/generated-preview.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "Generate Recruit preview content snapshot"
          git push origin HEAD:preview/vercel-pr16-uziuzborn
