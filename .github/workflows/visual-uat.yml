name: Visual UAT

on:
  push:
    branches:
      - codex/recruit-visual-uat

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-check live PR16 UAT service
        env:
          BASE_URL: https://uat-pr16-production.up.railway.app
        run: |
          set -euo pipefail
          for path in / /workflow /scenarios /scripts /templates /tools /offer-center /interview-analysis /hr-radar; do
            echo "GET ${BASE_URL}${path}"
            curl --fail --show-error --silent --location --output /dev/null "${BASE_URL}${path}"
          done

      - name: Locate system Chrome
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Install isolated browser driver
        run: |
          mkdir -p /tmp/visual-uat
          npm install --prefix /tmp/visual-uat --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0
          echo "NODE_PATH=/tmp/visual-uat/node_modules" >> "$GITHUB_ENV"

      - name: Capture browser UAT
        env:
          BASE_URL: https://uat-pr16-production.up.railway.app
        run: node .github/visual-uat.cjs

      - name: Upload visual UAT artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruit-pr16-visual-uat
          path: visual-uat/*
          if-no-files-found: error
          retention-days: 3
